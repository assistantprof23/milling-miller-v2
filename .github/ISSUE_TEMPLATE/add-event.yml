name: "Add Event"
description: "List a new event, workshop or seminar on the website"
title: "[EVENT] "
labels:
  - publish
  - "type:event"
body:
  - type: input
    id: title
    attributes:
      label: "Event Title"
      placeholder: "e.g. Rice Processing Workshop 2026"
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: "Date"
      description: "Format: YYYY-MM-DD"
      placeholder: "2026-09-15"
    validations:
      required: true

  - type: input
    id: time
    attributes:
      label: "Time"
      placeholder: "10:00 AM - 02:00 PM"
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: "Location"
      placeholder: "Conference Hall B, New Delhi"
    validations:
      required: true

  - type: input
    id: organizer
    attributes:
      label: "Organizer"
      placeholder: "Milling & Millers"
    validations:
      required: true

  - type: input
    id: image
    attributes:
      label: "Image URL (optional)"
      description: |
        To upload an image: drag it into any GitHub comment → copy the generated link → paste here.
      placeholder: "https://..."
    validations:
      required: false

  - type: input
    id: link
    attributes:
      label: "Registration / Event Link (optional)"
      placeholder: "https://..."
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: "Event Description"
      placeholder: "What will attendees learn or experience?"
    validations:
      required: true

name: "Add News Article"
description: "Publish a new news article to the website"
title: "[NEWS] "
labels:
  - publish
  - "type:news"
body:
  - type: input
    id: title
    attributes:
      label: "Article Title"
      description: "The headline of the article."
      placeholder: "e.g. Rice Export Ban Lifted"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: "Category"
      description: "Select the most relevant category."
      options:
        - Rice
        - Wheat
        - Biofuel
        - General
        - Industry
    validations:
      required: true

  - type: input
    id: image
    attributes:
      label: "Image URL"
      description: |
        Paste an image URL here.
        **To upload your own image:** drag and drop it into any GitHub comment box → copy the generated `https://github.com/user-attachments/...` link → paste it here.
      placeholder: "https://..."
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: "Summary (1–2 sentences)"
      description: "A short excerpt shown on the news listing page."
      placeholder: "Brief summary of the article..."
    validations:
      required: true

  - type: textarea
    id: body
    attributes:
      label: "Article Body"
      description: "Full article content. Supports Markdown formatting."
      placeholder: "Write the full article here..."
    validations:
      required: true
